name: October security gate
on:
  push:
    branches:
      - stabilization/oct19-security-tests
      - feature/oct16-reference-asset-workflow
      - fix/oct16-brand-draft-proof-500
      - feature/oct16-reference-ai-image-lab
      - fix/oct16-lock-architectural-reference-generation
      - feature/oct16-reference-grid-v1
  pull_request:
    paths:
      - 'security_roles.py'
      - 'campaign_studio_poc.py'
      - 'brand_asset_studio.py'
      - 'reference_image_lab.py'
      - 'reference_grid.py'
      - 'app.py'
      - 'review_addon.py'
      - 'revision_agent.py'
      - 'cloud_start.py'
      - 'tests/**'
      - '.github/workflows/security-tests.yml'
jobs:
  security-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app.py engine.py review_addon.py revision_agent.py ai_revision_v13.py security_roles.py cloud_start.py campaign_studio_poc.py brand_asset_studio.py reference_image_lab.py reference_grid.py
      - run: python -m unittest discover -s tests -v
