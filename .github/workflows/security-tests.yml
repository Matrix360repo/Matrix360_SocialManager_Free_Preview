name: October security gate
on:
  push:
    branches:
      - stabilization/oct19-security-tests
  pull_request:
    paths:
      - 'security_roles.py'
      - 'app.py'
      - 'review_addon.py'
      - 'revision_agent.py'
      - 'cloud_start.py'
      - 'tests/**'
      - '.github/workflows/security-tests.yml'
jobs:
  security-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app.py engine.py review_addon.py revision_agent.py ai_revision_v13.py security_roles.py cloud_start.py
      - run: python -m unittest discover -s tests -v
