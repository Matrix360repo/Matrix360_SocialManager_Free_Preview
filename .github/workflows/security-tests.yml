name: October security gate
on:
  push:
    branches:
      - stabilization/oct19-security-tests
      - feature/oct16-reference-asset-workflow
      - fix/oct16-brand-draft-proof-500
      - feature/oct16-reference-ai-image-lab
      - fix/oct16-lock-architectural-reference-generation
      - feature/oct16-reference-grid-v1
      - feature/oct16-reference-grid-v2-gallery-compositor
      - fix/oct16-architectural-proof-headline-overlap
      - feature/oct16-auto-recover-locked-gate-supabase
  pull_request:
    paths:
      - 'security_roles.py'
      - 'campaign_studio_poc.py'
      - 'brand_asset_studio.py'
      - 'reference_image_lab.py'
      - 'director_demo.py'
      - 'director_ai_studio.py'
      - 'production_media.py'
      - 'approval_acceptance.py'
      - 'motion_reels.py'
      - 'image_quality.py'
      - 'production_video_import.py'
      - 'startup_generation.py'
      - 'production_dashboard.py'
      - 'durable_campaign_store.py'
      - 'reference_grid.py'
      - 'reference_persistence.py director_demo.py'
      - 'reference_gallery_v2.py'
      - 'architectural_compositor.py'
      - 'app.py'
      - 'review_addon.py'
      - 'revision_agent.py'
      - 'cloud_start.py'
      - 'tests/**'
      - '.github/workflows/security-tests.yml'
jobs:
  security-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app.py engine.py review_addon.py revision_agent.py ai_revision_v13.py security_roles.py cloud_start.py campaign_studio_poc.py brand_asset_studio.py reference_image_lab.py reference_grid.py reference_gallery_v2.py architectural_compositor.py reference_persistence.py motion_reels.py image_quality.py production_media.py production_video_import.py startup_generation.py production_dashboard.py director_ai_studio.py durable_campaign_store.py
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: python -m unittest discover -s tests -v
